<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#141124" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)" />

  <!-- Digital HUD Grid -->
  <g opacity="0.15" stroke="#06b6d4" stroke-width="1">
    <circle cx="400" cy="225" r="180" fill="none" stroke-dasharray="8 6" />
    <circle cx="400" cy="225" r="130" fill="none" />
    <circle cx="400" cy="225" r="80" fill="none" stroke-dasharray="4 4" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="225" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow3)" />

  <!-- Center Face Scanner Reticle -->
  <g transform="translate(400, 225)">
    <!-- Camera Viewfinder Corners -->
    <!-- Top-Left -->
    <path d="M -85 -55 L -85 -85 L -55 -85" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" filter="url(#glow3)" />
    <!-- Top-Right -->
    <path d="M 55 -85 L 85 -85 L 85 -55" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" filter="url(#glow3)" />
    <!-- Bottom-Left -->
    <path d="M -85 55 L -85 85 L -55 85" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" filter="url(#glow3)" />
    <!-- Bottom-Right -->
    <path d="M 55 85 L 85 85 L 85 55" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" filter="url(#glow3)" />

    <!-- AI Biometric Facial Wireframe Mesh -->
    <!-- Head Outline -->
    <ellipse cx="0" cy="-5" rx="42" ry="54" fill="#0f262c" stroke="#06b6d4" stroke-width="2.5" opacity="0.9" />
    <!-- Forehead scan line -->
    <line x1="-28" y1="-30" x2="28" y2="-30" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2" />
    <!-- Eyes -->
    <ellipse cx="-16" cy="-12" rx="7" ry="4" fill="none" stroke="#67e8f9" stroke-width="2" />
    <circle cx="-16" cy="-12" r="2.5" fill="#10b981" />
    <ellipse cx="16" cy="-12" rx="7" ry="4" fill="none" stroke="#67e8f9" stroke-width="2" />
    <circle cx="16" cy="-12" r="2.5" fill="#10b981" />
    <!-- Nose line -->
    <path d="M 0 -8 L 4 6 L -2 10" fill="none" stroke="#06b6d4" stroke-width="2" />
    <!-- Mouth curve -->
    <path d="M -14 26 Q 0 34 14 26" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" />

    <!-- Facial Landmark Points -->
    <circle cx="-16" cy="-12" r="3" fill="#34d399" filter="url(#glow3)" />
    <circle cx="16" cy="-12" r="3" fill="#34d399" filter="url(#glow3)" />
    <circle cx="0" cy="10" r="2.5" fill="#38bdf8" />
    <circle cx="-14" cy="26" r="2.5" fill="#38bdf8" />
    <circle cx="14" cy="26" r="2.5" fill="#38bdf8" />
    <circle cx="0" cy="-30" r="2.5" fill="#38bdf8" />

    <!-- Horizontal Laser Scan Line -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#34d399" stroke-width="2.5" filter="url(#glow3)" opacity="0.95" />
    
    <!-- Status Badge -->
    <rect x="-60" y="95" width="120" height="24" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
    <text x="0" y="111" fill="#ecfdf5" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">✓ MATCH: 98.6%</text>
  </g>

  <!-- Left Card: Attendance Stats -->
  <g transform="translate(150, 225)">
    <rect x="-85" y="-55" width="170" height="110" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" filter="url(#glow3)" />
    <text x="0" y="-25" fill="#22d3ee" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">ATTENDANCE LOG</text>
    <line x1="-65" y1="-12" x2="65" y2="-12" stroke="#334155" stroke-width="1" />
    <text x="-65" y="12" fill="#e2e8f0" font-size="10" font-family="sans-serif">CS-2026 Batch</text>
    <text x="35" y="12" fill="#34d399" font-size="10" font-family="sans-serif" font-weight="bold">60 / 60</text>
    <text x="-65" y="32" fill="#e2e8f0" font-size="10" font-family="sans-serif">Status</text>
    <text x="20" y="32" fill="#38bdf8" font-size="10" font-family="sans-serif" font-weight="bold">LOCKED</text>
  </g>

  <!-- Right Card: Multi-Role Workflow -->
  <g transform="translate(650, 225)">
    <rect x="-85" y="-55" width="170" height="110" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.9" filter="url(#glow3)" />
    <text x="0" y="-25" fill="#34d399" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">MULTI-ROLE ACCESS</text>
    <line x1="-65" y1="-12" x2="65" y2="-12" stroke="#334155" stroke-width="1" />
    <text x="-65" y="10" fill="#94a3b8" font-size="10" font-family="sans-serif">👑 Admin Dashboard</text>
    <text x="-65" y="26" fill="#94a3b8" font-size="10" font-family="sans-serif">👨‍🏫 Faculty Verifier</text>
    <text x="-65" y="42" fill="#94a3b8" font-size="10" font-family="sans-serif">🎓 Student Portal</text>
  </g>

  <!-- Top Floating Header -->
  <g transform="translate(400, 65)">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="5" fill="#22d3ee" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">👁️ COMPUTER VISION ATTENDANCE AI</text>
  </g>
</svg>
