<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#181124" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />

  <!-- Isometric / Circuit Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <path d="M 0 100 L 250 100 L 350 200 L 800 200" fill="none" />
    <path d="M 0 350 L 300 350 L 400 250 L 800 250" fill="none" />
    <circle cx="250" cy="100" r="4" fill="#38bdf8" />
    <circle cx="350" cy="200" r="4" fill="#6366f1" />
    <circle cx="300" cy="350" r="4" fill="#a855f7" />
  </g>

  <!-- Central Shield Glow -->
  <circle cx="400" cy="225" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow2)" />
  <circle cx="400" cy="225" r="100" fill="#38bdf8" opacity="0.1" filter="url(#glow2)" />

  <!-- Center Security Shield -->
  <g transform="translate(400, 215)">
    <!-- Outer Shield Outline -->
    <path d="M 0 -80 Q 75 -75 90 0 C 90 70 45 110 0 135 C -45 110 -90 70 -90 0 Q -75 -75 0 -80 Z" fill="#111827" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow2)" />
    <!-- Inner Shield Body -->
    <path d="M 0 -70 Q 65 -65 78 0 C 78 60 40 95 0 118 C -40 95 -78 60 -78 0 Q -65 -65 0 -70 Z" fill="#1e1b4b" opacity="0.7" />

    <!-- Lock Icon in Shield -->
    <g transform="translate(0, 10)">
      <!-- Lock Shackle -->
      <path d="M -18 -15 C -18 -32 18 -32 18 -15 L 18 0 L -18 0 Z" fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" />
      <!-- Lock Body -->
      <rect x="-26" y="0" width="52" height="42" rx="8" fill="url(#accentGrad)" filter="url(#glow2)" />
      <!-- Keyhole -->
      <circle cx="0" cy="18" r="4.5" fill="#1e1b4b" />
      <polygon points="-2.5,18 2.5,18 4,32 -4,32" fill="#1e1b4b" />
    </g>
  </g>

  <!-- Left Card: Branch Protection -->
  <g transform="translate(150, 225)">
    <rect x="-85" y="-55" width="170" height="110" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" filter="url(#glow2)" />
    <text x="0" y="-25" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">BRANCH PROTECTION</text>
    <line x1="-65" y1="-12" x2="65" y2="-12" stroke="#374151" stroke-width="1" />
    <!-- Checkmark 1 -->
    <circle cx="-55" cy="8" r="7" fill="#059669" />
    <path d="M -58 8 L -56 10 L -52 6" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <text x="-40" y="12" fill="#d1d5db" font-size="10" font-family="sans-serif">Require PR Review</text>
    <!-- Checkmark 2 -->
    <circle cx="-55" cy="30" r="7" fill="#059669" />
    <path d="M -58 30 L -56 32 L -52 28" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <text x="-40" y="34" fill="#d1d5db" font-size="10" font-family="sans-serif">Block Force Push</text>
  </g>

  <!-- Right Card: Visibility Toggle -->
  <g transform="translate(650, 225)">
    <rect x="-85" y="-55" width="170" height="110" rx="12" fill="#111827" stroke="#a855f7" stroke-width="1.5" opacity="0.9" filter="url(#glow2)" />
    <text x="0" y="-25" fill="#c084fc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">BULK VISIBILITY</text>
    <line x1="-65" y1="-12" x2="65" y2="-12" stroke="#374151" stroke-width="1" />
    <!-- Toggle Switch 1 -->
    <rect x="-65" y="0" width="34" height="18" rx="9" fill="#9333ea" />
    <circle cx="-41" cy="9" r="7" fill="#ffffff" />
    <text x="-20" y="13" fill="#e5e7eb" font-size="10" font-family="sans-serif">Private Repo</text>
    <!-- Toggle Switch 2 -->
    <rect x="-65" y="24" width="34" height="18" rx="9" fill="#0284c7" />
    <circle cx="-41" cy="33" r="7" fill="#ffffff" />
    <text x="-20" y="37" fill="#e5e7eb" font-size="10" font-family="sans-serif">Actions Inject</text>
  </g>

  <!-- Top Floating Header -->
  <g transform="translate(400, 65)">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="5" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">🛡️ GITHUB REPO PRIVACY &amp; DEVOPS TOOL</text>
  </g>
</svg>
