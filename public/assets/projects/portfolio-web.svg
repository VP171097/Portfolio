<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b14" />
      <stop offset="50%" stop-color="#141126" />
      <stop offset="100%" stop-color="#1f1118" />
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad4)" />

  <!-- Grid & Particle Circles -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="337" x2="800" y2="337" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="225" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow4)" />
  <circle cx="550" cy="225" r="140" fill="#fbbf24" opacity="0.12" filter="url(#glow4)" />

  <!-- Center Laptop / Web App Frame -->
  <g transform="translate(400, 225)">
    <!-- Browser Window Container -->
    <rect x="-170" y="-105" width="340" height="210" rx="14" fill="#0f172a" stroke="url(#reactGrad)" stroke-width="2.5" filter="url(#glow4)" />
    <!-- Browser Header Bar -->
    <rect x="-170" y="-105" width="340" height="28" rx="14" fill="#1e293b" />
    <!-- Window Dots -->
    <circle cx="-148" cy="-91" r="5" fill="#ef4444" />
    <circle cx="-134" cy="-91" r="5" fill="#f59e0b" />
    <circle cx="-120" cy="-91" r="5" fill="#10b981" />
    <!-- URL Pill -->
    <rect x="-90" y="-98" width="180" height="14" rx="7" fill="#0f172a" />
    <text x="0" y="-87" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">vp171097.github.io/Portfolio</text>

    <!-- App Content Inside Mockup -->
    <!-- Hero Title Mockup -->
    <text x="0" y="-45" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">Vivek <tspan fill="#f59e0b">Pandey</tspan></text>
    <text x="0" y="-25" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Data Engineer &amp; Consultant</text>
    
    <!-- Shimmer Button Mockup -->
    <rect x="-55" y="-12" width="110" height="20" rx="10" fill="#f59e0b" />
    <text x="0" y="2" fill="#000000" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Download Resume</text>

    <!-- Cards Grid Mockup -->
    <rect x="-150" y="22" width="90" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="-105" y="42" fill="#38bdf8" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Experience</text>
    <rect x="-140" y="52" width="70" height="4" rx="2" fill="#475569" />
    <rect x="-140" y="62" width="50" height="4" rx="2" fill="#475569" />

    <rect x="-45" y="22" width="90" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="42" fill="#fbbf24" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Projects</text>
    <rect x="-35" y="52" width="70" height="4" rx="2" fill="#475569" />
    <rect x="-35" y="62" width="50" height="4" rx="2" fill="#475569" />

    <rect x="60" y="22" width="90" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="105" y="42" fill="#ec4899" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Skills</text>
    <rect x="70" y="52" width="70" height="4" rx="2" fill="#475569" />
    <rect x="70" y="62" width="50" height="4" rx="2" fill="#475569" />
  </g>

  <!-- Left Tech Badge -->
  <g transform="translate(130, 225)">
    <circle cx="0" cy="0" r="34" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow4)" />
    <text x="0" y="5" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">REACT 19</text>
  </g>

  <!-- Right Tech Badge -->
  <g transform="translate(670, 225)">
    <circle cx="0" cy="0" r="34" fill="#0f172a" stroke="#fbbf24" stroke-width="2" filter="url(#glow4)" />
    <text x="0" y="5" fill="#fbbf24" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">VITE + CI/CD</text>
  </g>

  <!-- Top Floating Header -->
  <g transform="translate(400, 65)">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="5" fill="#fbbf24" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">⚡ MODERN INTERACTIVE PORTFOLIO</text>
  </g>
</svg>
